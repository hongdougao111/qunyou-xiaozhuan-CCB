name: astrbot_plugin_hongdou_stock
display_name: 群友笑传之CCB · 红豆股市
short_desc: 用红豆币在群里炒股，有低保兜底，永远玩不破产。
desc: |
  一个完全离线的模拟炒股插件。钱币叫**红豆币**。

  价格由随机游走生成，不联网、不拉真实行情，纯粹是群里的娱乐小游戏。

  ## 为什么加低保

  模拟炒股最常见的死法不是亏钱，是**亏到一分不剩然后彻底没得玩**。
  所以这里有一条兜底线：总资产低于阈值的人，每天能领一次低保。
  金额和阈值都能在管理面板调，设成 0 就等于关闭。

  ## 特性

  - 🍁 **一个指令搞定**：`/股` 加子命令，不占指令表
  - 🍚 **低保兜底**：破产了也能重新起家
  - 💰 **长期持有有回报**：按持仓市值定期分红，鼓励拿住而不是天天折腾
  - 📈 **随机游走行情**：几何布朗运动 + 软边界，跌不穿也涨不上天
  - 💾 **全量落盘**：所有账户存 `data/plugin_data/`，重启、重装不丢
  - 🧪 **可离线自测**：`test_plugin.py` 不需要安装 AstrBot

  ## 指令

  - `/股` 行情总览
  - `/股 买 <代码> <股数>` 买入
  - `/股 卖 <代码> <股数>` 卖出（股数写 `all` 全卖）
  - `/股 仓` 我的持仓与浮动盈亏
  - `/股 榜` 富豪榜
  - `/股 低保` 领低保
  - `/股 看 <代码>` 单只详情
  - `/股诊断` 运行状态（排查用）

  ## 交易规则

  - 手续费 0.15%，最低 1 红豆币，买卖都收
  - 单次行情最大涨跌 12%，防止随机数把价格撕碎
  - 价格跌破基准价 20% 时漂移转正、涨过 500% 时转负

  ## 说明

  所有股票、板块、公司名均为虚构，与任何真实标的无关。
