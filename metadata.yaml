name: astrbot_plugin_hongdou_stock
display_name: 红豆币爆仓模拟器
short_desc: 用红豆币炒外汇，开杠杆、会爆仓、有低保。
desc: |
  一个完全离线的外汇保证金交易模拟插件。钱币叫**红豆币**。

  ## 灵感来源

  本插件借鉴了日本漫画《FX戦士くるみちゃん》（中译《FX战士久留美》）的题材：
  「拿小钱梭哈外汇、杠杆拉满、反复爆仓」这种荒诞感。

  借鉴的只是**题材与情绪**，没有使用原作任何角色形象、美术、对白或其他素材，
  代码与数值模型全部原创，插件内也没有出现原作角色。

  本项目为独立、非商业作品，与原作作者及出版方无关联，未获授权或背书，
  原作版权归原作者及出版方所有。

  ## 它到底在玩什么

  不是「怎么赚钱」，是**仓位管理**：

  - 1 手 = 1000 红豆币名义价值，杠杆最高 500 倍
  - 100 倍杠杆下，价格反向走 1% 就爆仓
  - 每 tick 检查权益，跌破保证金 50% 直接强平，余额清零

  ## 为什么有低保

  外汇模拟最常见的死法不是慢慢亏，是**一把梭哈然后瞬间归零**。
  所以这里有一条兜底线：权益低于阈值的人，每天能领一次低保。
  金额和阈值都能在管理面板调，设成 0 就等于关闭。

  这不是慈善，是让游戏不会因为一个人爆仓而结束。

  ## 特性

  - 🎯 **一个指令**：`/fx` 加子命令，不占指令表
  - 💥 **真会爆仓**：保证金比例实时显示，低于 150% 会警告
  - 🍚 **低保兜底**：爆干净了也能重新起家
  - 📉 **八种货币对**：从温和的 EURUSD 到「野兽」GBPJPY，还有黄金
  - 💸 **隔夜利息**：持仓过夜多头付息、空头收息，防止开了不管
  - 💾 **全量落盘**：账户存 `data/plugin_data/`，重启重装不丢
  - 🧪 **可离线自测**：`test_plugin.py` 不需要安装 AstrBot

  ## 指令

  - `/fx` 行情与账户
  - `/fx 多 <货币对> <手数> [杠杆]` 做多
  - `/fx 空 <货币对> <手数> [杠杆]` 做空
  - `/fx 平 <编号>` 平仓
  - `/fx 全平` 一键平掉全部
  - `/fx 仓` 我的仓位
  - `/fx 榜` 富豪榜
  - `/fx 低保` 领低保
  - `/fx 看 <货币对>` 单对详情
  - `/fx诊断` 运行状态（排查用）

  ## 交易规则

  - 点差：单边 0.012%
  - 手续费：名义价值 0.02%，开平各收一次
  - 强平线：权益 < 占用保证金 × 50%
  - 单 tick 最大波动 3%

  ## 说明

  所有报价由本地随机游走生成，**不联网、不接真实行情**，与真实市场无关。
  盈亏直接以红豆币计价，不做交叉汇率换算 —— 这是刻意的简化。
